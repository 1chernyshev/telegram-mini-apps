<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="color-scheme" content="light dark">
<title>Мои финансы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-glow" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
</div>

<div id="app">

  <header class="topbar">
    <h1 class="topbar-title" id="screen-title">Мои финансы</h1>
    <div class="topbar-actions">
      <span class="chip chip-currency" id="topbar-currency">RUB</span>
    </div>
  </header>

  <main id="screens">

    <section class="screen" id="screen-home" data-screen="home">
      <div class="glass card card-balance">
        <div class="balance-label" data-i18n="totalBalance">Общий баланс</div>
        <div class="balance-value" id="home-balance">0</div>
        <div class="balance-stats">
          <div class="balance-stat stat-income">
            <span class="stat-arrow">↓</span>
            <div>
              <div class="stat-label" data-i18n="income">Доход</div>
              <div class="stat-value" id="home-income">0</div>
            </div>
          </div>
          <div class="balance-stat stat-expense">
            <span class="stat-arrow">↑</span>
            <div>
              <div class="stat-label" data-i18n="expense">Расход</div>
              <div class="stat-value" id="home-expense">0</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section-row">
        <h2 class="section-title" data-i18n="accounts">Счета</h2>
      </div>
      <div class="accounts-scroll" id="home-accounts"></div>

      <div class="section-row">
        <h2 class="section-title" data-i18n="recentTransactions">Последние операции</h2>
        <button type="button" class="link-btn" id="home-see-all" data-i18n="seeAll">Все →</button>
      </div>
      <div class="glass card card-list" id="home-transactions"></div>
    </section>

    <section class="screen" id="screen-transactions" data-screen="transactions" hidden>
      <div class="segmented" id="tx-filter">
        <button type="button" class="segmented-btn active" data-filter="all" data-i18n="all">Все</button>
        <button type="button" class="segmented-btn" data-filter="expense" data-i18n="expense">Расход</button>
        <button type="button" class="segmented-btn" data-filter="income" data-i18n="income">Доход</button>
      </div>
      <div id="tx-list"></div>
    </section>

    <section class="screen" id="screen-analytics" data-screen="analytics" hidden>
      <div class="month-nav glass">
        <button type="button" class="icon-btn" id="an-prev" aria-label="Prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
        <span id="an-period-label">Август 2026</span>
        <button type="button" class="icon-btn" id="an-next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>

      <div class="segmented" id="an-kind">
        <button type="button" class="segmented-btn active" data-kind="expense" data-i18n="expense">Расход</button>
        <button type="button" class="segmented-btn" data-kind="income" data-i18n="income">Доход</button>
      </div>

      <div class="glass card card-chart">
        <div class="donut-wrap" id="an-donut"></div>
        <div class="legend" id="an-legend"></div>
      </div>
    </section>

    <section class="screen" id="screen-settings" data-screen="settings" hidden>

      <div class="settings-section">
        <div class="section-row"><h2 class="section-title" data-i18n="appearance">Оформление</h2></div>
        <div class="segmented" id="set-theme">
          <button type="button" class="segmented-btn" data-theme="system" data-i18n="themeSystem">Как на устройстве</button>
          <button type="button" class="segmented-btn" data-theme="light" data-i18n="themeLight">Светлая</button>
          <button type="button" class="segmented-btn" data-theme="dark" data-i18n="themeDark">Тёмная</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-row"><h2 class="section-title" data-i18n="language">Язык</h2></div>
        <div class="pill-grid" id="set-language"></div>
      </div>

      <div class="settings-section">
        <div class="section-row"><h2 class="section-title" data-i18n="currency">Валюта</h2></div>
        <div class="pill-grid" id="set-currency"></div>
      </div>

      <div class="settings-section">
        <div class="section-row">
          <h2 class="section-title" data-i18n="accounts">Счета</h2>
          <button type="button" class="link-btn" id="acc-add" data-i18n="add">+ Добавить</button>
        </div>
        <div class="glass card card-list" id="set-accounts"></div>
        <label class="archive-toggle">
          <input type="checkbox" id="acc-show-archived">
          <span data-i18n="showArchived">Показать архивные</span>
        </label>
      </div>

      <div class="settings-section">
        <div class="section-row">
          <h2 class="section-title" data-i18n="categories">Категории</h2>
          <button type="button" class="link-btn" id="cat-add" data-i18n="add">+ Добавить</button>
        </div>
        <div class="segmented" id="cat-kind">
          <button type="button" class="segmented-btn active" data-kind="expense" data-i18n="expense">Расход</button>
          <button type="button" class="segmented-btn" data-kind="income" data-i18n="income">Доход</button>
        </div>
        <div class="glass card card-list" id="set-categories"></div>
        <label class="archive-toggle">
          <input type="checkbox" id="cat-show-archived">
          <span data-i18n="showArchived">Показать архивные</span>
        </label>
      </div>

    </section>

  </main>

  <nav class="tabbar glass" id="tabbar">
    <button type="button" class="tab-btn active" data-tab="home" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9"/></svg>
      <span data-i18n="navHome">Главная</span>
    </button>
    <button type="button" class="tab-btn" data-tab="transactions" aria-label="Transactions">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <span data-i18n="navTransactions">Операции</span>
    </button>
    <button type="button" class="tab-btn tab-add" data-tab="add" aria-label="Add">
      <span class="tab-add-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </span>
    </button>
    <button type="button" class="tab-btn" data-tab="analytics" aria-label="Analytics">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      <span data-i18n="navAnalytics">Аналитика</span>
    </button>
    <button type="button" class="tab-btn" data-tab="settings" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg>
      <span data-i18n="navSettings">Настройки</span>
    </button>
  </nav>

</div>

<div class="sheet-overlay" id="sheet-overlay" hidden>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet glass" id="sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h3 id="sheet-title">Title</h3>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="app.js" type="module"></script>
</body>
</html>
